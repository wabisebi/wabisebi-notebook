<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N5 Kanji · Wabisebi Grammar Notebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Shippori+Mincho:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../style.css">

<header class="top" id="top"></header>
<div class="layout">
  <main>
    <section class="home kana-board" id="kanji">
      <div class="home-head">
        <h1>N5 Kanji</h1>
        <button class="romaji-toggle" type="button" aria-pressed="true" data-label="Meaning">Meaning: on</button>
      </div>
      <div class="stroke-panel" data-first="一"></div>
      <details class="level" open><summary><span class="t">Numbers</span><span class="label">14 kanji</span></summary>
        <div class="kgrid five">
          <button class="kana" type="button"><span class="k">一</span><span class="r">one</span></button>
          <button class="kana" type="button"><span class="k">二</span><span class="r">two</span></button>
          <button class="kana" type="button"><span class="k">三</span><span class="r">three</span></button>
          <button class="kana" type="button"><span class="k">四</span><span class="r">four</span></button>
          <button class="kana" type="button"><span class="k">五</span><span class="r">five</span></button>
          <button class="kana" type="button"><span class="k">六</span><span class="r">six</span></button>
          <button class="kana" type="button"><span class="k">七</span><span class="r">seven</span></button>
          <button class="kana" type="button"><span class="k">八</span><span class="r">eight</span></button>
          <button class="kana" type="button"><span class="k">九</span><span class="r">nine</span></button>
          <button class="kana" type="button"><span class="k">十</span><span class="r">ten</span></button>
          <button class="kana" type="button"><span class="k">百</span><span class="r">hundred</span></button>
          <button class="kana" type="button"><span class="k">千</span><span class="r">thousand</span></button>
          <button class="kana" type="button"><span class="k">万</span><span class="r">10,000</span></button>
          <button class="kana" type="button"><span class="k">円</span><span class="r">yen</span></button>
        </div>
      </details>
      <details class="level" open><summary><span class="t">Time</span><span class="label">18 kanji</span></summary>
        <div class="kgrid five">
          <button class="kana" type="button"><span class="k">日</span><span class="r">sun, day</span></button>
          <button class="kana" type="button"><span class="k">月</span><span class="r">moon, month</span></button>
          <button class="kana" type="button"><span class="k">火</span><span class="r">fire</span></button>
          <button class="kana" type="button"><span class="k">水</span><span class="r">water</span></button>
          <button class="kana" type="button"><span class="k">木</span><span class="r">tree</span></button>
          <button class="kana" type="button"><span class="k">金</span><span class="r">gold, money</span></button>
          <button class="kana" type="button"><span class="k">土</span><span class="r">soil</span></button>
          <button class="kana" type="button"><span class="k">年</span><span class="r">year</span></button>
          <button class="kana" type="button"><span class="k">時</span><span class="r">time</span></button>
          <button class="kana" type="button"><span class="k">分</span><span class="r">minute, part</span></button>
          <button class="kana" type="button"><span class="k">間</span><span class="r">between</span></button>
          <button class="kana" type="button"><span class="k">午</span><span class="r">noon</span></button>
          <button class="kana" type="button"><span class="k">前</span><span class="r">before</span></button>
          <button class="kana" type="button"><span class="k">後</span><span class="r">after</span></button>
          <button class="kana" type="button"><span class="k">半</span><span class="r">half</span></button>
          <button class="kana" type="button"><span class="k">今</span><span class="r">now</span></button>
          <button class="kana" type="button"><span class="k">毎</span><span class="r">every</span></button>
          <button class="kana" type="button"><span class="k">先</span><span class="r">ahead</span></button>
        </div>
      </details>
      <details class="level" open><summary><span class="t">People</span><span class="label">8 kanji</span></summary>
        <div class="kgrid five">
          <button class="kana" type="button"><span class="k">人</span><span class="r">person</span></button>
          <button class="kana" type="button"><span class="k">男</span><span class="r">man</span></button>
          <button class="kana" type="button"><span class="k">女</span><span class="r">woman</span></button>
          <button class="kana" type="button"><span class="k">子</span><span class="r">child</span></button>
          <button class="kana" type="button"><span class="k">父</span><span class="r">father</span></button>
          <button class="kana" type="button"><span class="k">母</span><span class="r">mother</span></button>
          <button class="kana" type="button"><span class="k">友</span><span class="r">friend</span></button>
          <button class="kana" type="button"><span class="k">名</span><span class="r">name</span></button>
        </div>
      </details>
      <details class="level" open><summary><span class="t">Places and directions</span><span class="label">13 kanji</span></summary>
        <div class="kgrid five">
          <button class="kana" type="button"><span class="k">上</span><span class="r">up</span></button>
          <button class="kana" type="button"><span class="k">下</span><span class="r">down</span></button>
          <button class="kana" type="button"><span class="k">中</span><span class="r">middle</span></button>
          <button class="kana" type="button"><span class="k">外</span><span class="r">outside</span></button>
          <button class="kana" type="button"><span class="k">左</span><span class="r">left</span></button>
          <button class="kana" type="button"><span class="k">右</span><span class="r">right</span></button>
          <button class="kana" type="button"><span class="k">東</span><span class="r">east</span></button>
          <button class="kana" type="button"><span class="k">西</span><span class="r">west</span></button>
          <button class="kana" type="button"><span class="k">南</span><span class="r">south</span></button>
          <button class="kana" type="button"><span class="k">北</span><span class="r">north</span></button>
          <button class="kana" type="button"><span class="k">国</span><span class="r">country</span></button>
          <button class="kana" type="button"><span class="k">学</span><span class="r">study</span></button>
          <button class="kana" type="button"><span class="k">校</span><span class="r">school</span></button>
        </div>
      </details>
      <details class="level" open><summary><span class="t">Nature</span><span class="label">5 kanji</span></summary>
        <div class="kgrid five">
          <button class="kana" type="button"><span class="k">山</span><span class="r">mountain</span></button>
          <button class="kana" type="button"><span class="k">川</span><span class="r">river</span></button>
          <button class="kana" type="button"><span class="k">天</span><span class="r">sky</span></button>
          <button class="kana" type="button"><span class="k">気</span><span class="r">spirit</span></button>
          <button class="kana" type="button"><span class="k">雨</span><span class="r">rain</span></button>
        </div>
      </details>
      <details class="level" open><summary><span class="t">Actions</span><span class="label">11 kanji</span></summary>
        <div class="kgrid five">
          <button class="kana" type="button"><span class="k">行</span><span class="r">go</span></button>
          <button class="kana" type="button"><span class="k">来</span><span class="r">come</span></button>
          <button class="kana" type="button"><span class="k">見</span><span class="r">see</span></button>
          <button class="kana" type="button"><span class="k">聞</span><span class="r">hear</span></button>
          <button class="kana" type="button"><span class="k">話</span><span class="r">talk</span></button>
          <button class="kana" type="button"><span class="k">読</span><span class="r">read</span></button>
          <button class="kana" type="button"><span class="k">書</span><span class="r">write</span></button>
          <button class="kana" type="button"><span class="k">食</span><span class="r">eat</span></button>
          <button class="kana" type="button"><span class="k">出</span><span class="r">exit</span></button>
          <button class="kana" type="button"><span class="k">入</span><span class="r">enter</span></button>
          <button class="kana" type="button"><span class="k">休</span><span class="r">rest</span></button>
        </div>
      </details>
      <details class="level" open><summary><span class="t">Describing</span><span class="label">5 kanji</span></summary>
        <div class="kgrid five">
          <button class="kana" type="button"><span class="k">大</span><span class="r">big</span></button>
          <button class="kana" type="button"><span class="k">小</span><span class="r">small</span></button>
          <button class="kana" type="button"><span class="k">長</span><span class="r">long</span></button>
          <button class="kana" type="button"><span class="k">高</span><span class="r">high</span></button>
          <button class="kana" type="button"><span class="k">白</span><span class="r">white</span></button>
        </div>
      </details>
      <details class="level" open><summary><span class="t">Other</span><span class="label">6 kanji</span></summary>
        <div class="kgrid five">
          <button class="kana" type="button"><span class="k">本</span><span class="r">book</span></button>
          <button class="kana" type="button"><span class="k">語</span><span class="r">language</span></button>
          <button class="kana" type="button"><span class="k">電</span><span class="r">electric</span></button>
          <button class="kana" type="button"><span class="k">車</span><span class="r">car</span></button>
          <button class="kana" type="button"><span class="k">何</span><span class="r">what</span></button>
          <button class="kana" type="button"><span class="k">生</span><span class="r">life</span></button>
        </div>
      </details>
    </section>

    <p class="foot" id="foot"></p>
  </main>
</div>
<script src="../strokes.js"></script>
<script src="../site.js"></script>
