      <div class="home-head">

      <div class="kanji-top">

        <div class="onkun">
          <h2>Two kinds of reading</h2>
          <dl>
            <dt>On'yomi</dt><dd>The Chinese sound, used in kanji compounds.<span class="ex">富士<b>山</b> ふじ<b>さん</b></span></dd>
            <dt>Kun'yomi</dt><dd>The Japanese word, used alone or with hiragana.<span class="ex"><b>山</b> <b>やま</b></span></dd>
          </dl>
        </div>
      </div>
      <details class="level" open><summary><span class="t">Numbers</span><span class="label">14 kanji</span></summary>
