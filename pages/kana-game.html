<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kana Game · Wabisebi Grammar Notebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Shippori+Mincho:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../style.css">

<header class="top" id="top"></header>
<div class="layout">
  <main>
    <section class="home game" id="kana-game">
      <div class="home-head">
        <h1>Kana Game</h1>
      </div>
      <div class="game-sets" role="group" aria-label="What to practise">
        <button class="chip" type="button" data-set="hira" aria-pressed="true">あ Hiragana</button>
        <button class="chip" type="button" data-set="kata" aria-pressed="false">ア Katakana</button>
        <button class="chip" type="button" data-set="dakuten" aria-pressed="false">゛ ゜ Dakuten</button>
        <button class="chip" type="button" data-set="combo" aria-pressed="false">きゃ Combos</button>
      </div>
      <div class="game-fonts" id="game-fonts" role="group" aria-label="Fonts to practise with"></div>
      <div class="game-card">
        <div class="game-kana" id="game-kana" lang="ja">あ</div>
        <input class="game-input" id="game-input" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the romaji" aria-label="Romaji">
        <p class="game-msg" id="game-msg">Type the romaji. Enter skips.</p>
        <p class="game-score" id="game-score"></p>
      </div>
    </section>

    <p class="foot" id="foot"></p>
  </main>
</div>
<script src="../site.js"></script>
