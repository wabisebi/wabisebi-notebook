      <div class="lvl-note">
        <p class="label">No official list</p>
        <p>The JLPT hasn't published grammar lists since 2010, so every N4 list you'll find is someone's best guess, based on the old official lists and past tests. The lists mostly agree but differ at the edges: a point can be N4 in one list and N3 or N5 in another.</p>
